name: PitchIntel Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: "Enable the EC2 deployment steps (leave unchecked for code-only use)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        working-directory: backend
        env:
          JWT_SECRET_KEY: ci-only-test-secret-not-for-production
          DATABASE_URL: sqlite:///./ci-test.db
        run: |
          pip install -r requirements.txt
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend production build
        working-directory: frontend
        run: |
          npm install
          npm run build

  publish-and-deploy:
    if: ${{ inputs.deploy_to_ec2 == true }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/rahul-17personal/capstone-agentic-ai-backend:latest
            ghcr.io/rahul-17personal/capstone-agentic-ai-backend:${{ github.sha }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=/api/v1
          tags: |
            ghcr.io/rahul-17personal/capstone-agentic-ai-frontend:latest
            ghcr.io/rahul-17personal/capstone-agentic-ai-frontend:${{ github.sha }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Trust EC2 host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy production Compose file
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p ${{ secrets.EC2_APP_DIR }}/backend"
          scp docker-compose.prod.yml "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/docker-compose.yml"

      - name: Authenticate EC2 with GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh "$EC2_USER@$EC2_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Pull and restart services on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" "cd '$EC2_APP_DIR' && IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.yml pull && IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.yml up -d --remove-orphans"
